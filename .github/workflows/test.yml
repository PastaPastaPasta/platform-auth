name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v6

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Set Up Python (passkey-vault vector generator)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Vector Generator's Dependency
        run: python -m pip install cryptography

      - name: Lint
        run: npm run lint

      - name: Test (with coverage)
        run: npm run test:coverage
        env:
          PASSKEY_VAULT_REQUIRE_PYTHON: '1'

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
